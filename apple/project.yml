# The Xcode project for the Apple apps, generated by XcodeGen (brew install xcodegen; then `xcodegen`
# in this folder, and open Polyphony.xcodeproj). The project file itself isn't committed: this is the
# source of truth, so it merges cleanly and needs no Xcode to edit.
name: Polyphony
options:
  bundleIdPrefix: app.polyphony
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PolyphonyKit:
    path: PolyphonyKit
targets:
  Polyphony:
    type: application
    platform: macOS
    sources:
      - path: Polyphony
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: PolyphonyKit
    info:
      path: Polyphony/Resources/Info.plist
      properties:
        CFBundleDisplayName: Polyphony
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "GPL-3.0"
        # Navidrome on the LAN is often plain http (http://192.168.x.x:4533): allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.polyphony.mac
        PRODUCT_NAME: Polyphony
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Swift 5 mode for the app: AVFoundation's callbacks predate strict concurrency, and the app
        # layer is thin. PolyphonyKit underneath is Swift 6.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: YES
        # Signed to run locally ("Sign to Run Locally"); a Developer ID comes with distribution.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Polyphony:
    build:
      targets:
        Polyphony: all
    run:
      config: Debug
