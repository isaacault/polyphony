name: Build

# Day-to-day CI is local (scripts/ci.sh, gated by the `local-ci` commit status). This workflow is
# kept for outside contributors: it runs on pull requests from forks, and on demand.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew :android:app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: polyphony-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker:
    # Proves the Dockerfile still builds on x86_64; on demand only (scripts/ci.sh exercises it on every run).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t polyphony-build .
      - name: Build APK inside the image
        run: docker run --rm -v "$PWD":/src polyphony-build sh -c "./gradlew --no-daemon :android:app:assembleDebug"
