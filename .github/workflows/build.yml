name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: polyphony-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker:
    # Proves the Dockerfile still builds; runs only on main to save minutes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t polyphony-build .
      - name: Build APK inside the image
        run: docker run --rm -v "$PWD":/src polyphony-build sh -c "./gradlew --no-daemon :app:assembleDebug"
