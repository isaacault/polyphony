name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version.properties
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match VERSION_NAME=$VERSION in version.properties" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$TAG" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "POLYPHONY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Build signed release APK and bundle
        env:
          POLYPHONY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POLYPHONY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          POLYPHONY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Verify signature and collect artifacts
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/37.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          mkdir -p dist
          cp "$APK" "dist/polyphony-${VERSION}.apk"
          cp "$AAB" "dist/polyphony-${VERSION}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/polyphony-${VERSION}-mapping.txt"
          (cd dist && sha256sum * > "polyphony-${VERSION}.sha256")
          cat "dist/polyphony-${VERSION}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; [ "$PRERELEASE" = "true" ] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Polyphony $VERSION" \
            --generate-notes \
            $PRE \
            --verify-tag

      - uses: actions/upload-artifact@v4
        with:
          name: polyphony-release-${{ env.VERSION }}
          path: dist/*
