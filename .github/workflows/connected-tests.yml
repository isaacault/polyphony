name: Connected tests

# The instrumented tests (Room migrations, DLNA parsing through Android's own XML factory) need a
# device. They run nightly and on demand, not per PR, because an emulator run costs ~10 minutes.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/src/androidTest/**"
      - "core/data/schemas/**"
      - ".github/workflows/connected-tests.yml"

concurrency:
  group: connected-tests
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :core:data:connectedDebugAndroidTest :core:dlna:connectedDebugAndroidTest --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-test-reports
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
